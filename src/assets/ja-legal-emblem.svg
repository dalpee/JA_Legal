<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Gradiente metálico dorado principal multicapa -->
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c7" />
      <stop offset="18%" stop-color="#f5d278" />
      <stop offset="42%" stop-color="#d49f39" />
      <stop offset="65%" stop-color="#fae7a0" />
      <stop offset="85%" stop-color="#ad7b20" />
      <stop offset="100%" stop-color="#e0b252" />
    </linearGradient>

    <!-- Gradiente para el trazo horizontal de la balanza -->
    <linearGradient id="beamGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c69530" />
      <stop offset="50%" stop-color="#fae8a6" />
      <stop offset="100%" stop-color="#c69530" />
    </linearGradient>

    <!-- Gradiente sutil para las líneas de división de Asociados -->
    <linearGradient id="lineFadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d49f39" stop-opacity="0" />
      <stop offset="100%" stop-color="#fae7a0" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="lineFadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fae7a0" stop-opacity="1" />
      <stop offset="100%" stop-color="#d49f39" stop-opacity="0" />
    </linearGradient>

    <!-- Sombra dorada suave para profundidad de lujo -->
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d49f39" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- ======================================================== -->
    <!-- 1. BALANZA DE LA JUSTICIA (PARTE SUPERIOR)               -->
    <!-- ======================================================== -->
    <g transform="translate(0, 0)">
      <!-- Punta decorativa central (remate superior) -->
      <path d="M 250,70 L 254,82 L 250,96 L 246,82 Z" fill="url(#emblemGold)" />
      
      <!-- Columna / Mástil central -->
      <rect x="247.5" y="96" width="5" height="78" rx="2" fill="url(#emblemGold)" />
      <circle cx="250" cy="112" r="6.5" fill="url(#emblemGold)" />
      <circle cx="250" cy="150" r="4.5" fill="url(#emblemGold)" />
      <path d="M 245,174 L 255,174 L 250,182 Z" fill="url(#emblemGold)" />

      <!-- Brazo / Viga horizontal de la balanza -->
      <path d="M 180,112 C 215,107 285,107 320,112" stroke="url(#beamGold)" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <circle cx="180" cy="112" r="3.5" fill="url(#emblemGold)" />
      <circle cx="320" cy="112" r="3.5" fill="url(#emblemGold)" />

      <!-- Platillo Izquierdo con cuerdas -->
      <g>
        <line x1="180" y1="112" x2="162" y2="152" stroke="url(#emblemGold)" stroke-width="2.2" stroke-linecap="round" />
        <line x1="180" y1="112" x2="198" y2="152" stroke="url(#emblemGold)" stroke-width="2.2" stroke-linecap="round" />
        <!-- Plato cóncavo -->
        <path d="M 156,152 C 160,165 200,165 204,152 Z" fill="url(#emblemGold)" />
        <path d="M 154,152 L 206,152" stroke="url(#emblemGold)" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Platillo Derecho con cuerdas -->
      <g>
        <line x1="320" y1="112" x2="302" y2="152" stroke="url(#emblemGold)" stroke-width="2.2" stroke-linecap="round" />
        <line x1="320" y1="112" x2="338" y2="152" stroke="url(#emblemGold)" stroke-width="2.2" stroke-linecap="round" />
        <!-- Plato cóncavo -->
        <path d="M 296,152 C 300,165 340,165 344,152 Z" fill="url(#emblemGold)" />
        <path d="M 294,152 L 346,152" stroke="url(#emblemGold)" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- ======================================================== -->
    <!-- 2. MONOGRAMA CENTRAL: J&A CON SWOOSH DORADO             -->
    <!-- ======================================================== -->
    <g transform="translate(0, 0)">
      <!-- Letra J -->
      <path d="M 152,192 L 202,192 L 202,204 L 186,204 L 186,268 C 186,290 174,306 148,306 C 128,306 116,294 114,282 L 126,278 C 128,286 136,293 148,293 C 164,293 172,281 172,264 L 172,204 L 152,204 Z" fill="url(#emblemGold)" />

      <!-- Ampersand & central integrado -->
      <path d="M 252,246 C 259,239 265,230 265,221 C 265,210 257,202 244,202 C 231,202 222,210 222,222 C 222,233 229,243 241,253 L 218,279 C 213,275 210,268 210,260 L 198,260 C 198,272 205,283 214,289 L 200,305 L 210,311 L 226,293 C 233,296 242,298 251,298 C 271,298 285,286 285,269 C 285,257 277,249 267,244 Z M 243,213 C 249,213 253,217 253,222 C 253,228 249,235 243,241 C 238,235 235,229 235,223 C 235,217 238,213 243,213 Z M 250,287 C 242,287 235,284 229,280 L 246,260 C 254,265 260,271 260,277 C 260,283 256,287 250,287 Z" fill="url(#emblemGold)" opacity="0.9" />

      <!-- Letra A -->
      <path d="M 314,192 L 328,192 L 372,304 L 358,304 L 347,274 L 297,274 L 286,304 L 272,304 Z M 302,261 L 342,261 L 322,207 Z" fill="url(#emblemGold)" />

      <!-- TRAZO DISTINTIVO DE LA MARCA (Curva/Swoosh dinámico que cruza la A) -->
      <path d="M 194,266 C 220,308 268,318 316,290 C 352,270 382,274 398,277 C 374,288 338,308 296,308 C 244,308 210,286 194,266 Z" fill="url(#emblemGold)" />
      <path d="M 292,263 C 334,258 372,268 396,278 C 370,273 336,268 294,271 Z" fill="url(#emblemGold)" />
    </g>

    <!-- ======================================================== -->
    <!-- 3. NOMBRE DE LA FIRMA: JIMENEZ & ARIZA                   -->
    <!-- ======================================================== -->
    <g transform="translate(0, 0)">
      <text
        x="250"
        y="370"
        text-anchor="middle"
        font-family="'Source Serif 4', 'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="34"
        font-weight="600"
        letter-spacing="5.5"
        fill="url(#emblemGold)"
      >
        JIMENEZ &amp; ARIZA
      </text>

      <!-- Línea izquierda que enmarca ASOCIADOS -->
      <line x1="75" y1="400" x2="175" y2="400" stroke="url(#lineFadeLeft)" stroke-width="2" stroke-linecap="round" />

      <!-- Texto ASOCIADOS con tracking amplio -->
      <text
        x="250"
        y="406"
        text-anchor="middle"
        font-family="'Cinzel', 'Source Serif 4', 'Inter', Georgia, serif"
        font-size="14.5"
        font-weight="600"
        letter-spacing="9"
        fill="url(#emblemGold)"
      >
        ASOCIADOS
      </text>

      <!-- Línea derecha que enmarca ASOCIADOS -->
      <line x1="325" y1="400" x2="425" y2="400" stroke="url(#lineFadeRight)" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
