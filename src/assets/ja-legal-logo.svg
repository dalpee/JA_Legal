<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d790" />
      <stop offset="50%" stop-color="#d9b56a" />
      <stop offset="100%" stop-color="#a9812e" />
    </linearGradient>
  </defs>
  
  <!-- Crest Icon -->
  <g transform="translate(10, 8)">
    <!-- Scale icon -->
    <path d="M26 4 L26 48 M10 16 L42 16" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10 16 L4 32 L16 32 Z" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
    <path d="M42 16 L36 32 L48 32 Z" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
    <path d="M18 48 L34 48" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Small star / diamond at top -->
    <polygon points="26,1 28,4 26,7 24,4" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(70, 16)">
    <!-- Monogram J&A -->
    <text x="0" y="22" font-family="'Source Serif 4', Georgia, serif" font-size="24" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">J&amp;A</text>
    
    <!-- Firm Name -->
    <text x="68" y="16" font-family="'Source Serif 4', Georgia, serif" font-size="14" font-weight="600" fill="#f4f1e8" letter-spacing="2.5">JIMÉNEZ &amp; ARIZA</text>
    <text x="70" y="29" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#8891a3" letter-spacing="5">ASOCIADOS</text>
  </g>
</svg>
